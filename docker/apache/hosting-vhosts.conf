# Hosted projects share one Apache/PHP container. The dashboard controls the
# /var/www/runtime/lan-enabled marker file to switch LAN access on or off.

# Apache port 80 serves the host-computer-only endpoint.
Listen 8081

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Path-based fallback: http://localhost:8090/sites/example/
    Alias /sites/ /var/www/sites/

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <Directory /var/www/sites>
        Options FollowSymLinks
        AllowOverride FileInfo Indexes Options=FollowSymLinks,SymLinksIfOwnerMatch,Indexes AuthConfig
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Each folder in ./sites becomes a local subdomain:
# ./sites/shop/index.php -> http://shop.localhost:8090/
<VirtualHost *:80>
    ServerName hosting-wildcard.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/sites/%1

    <Directory /var/www/sites>
        Options FollowSymLinks
        AllowOverride FileInfo Indexes Options=FollowSymLinks,SymLinksIfOwnerMatch,Indexes
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Apache port 8081 is published on the host as LAN_PORT. Every request on this
# listener requires the marker file created by the dashboard's LAN switch.
<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot /var/www/html
    Alias /sites/ /var/www/sites/

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require expr "-f '/var/www/runtime/lan-enabled'"
        DirectoryIndex index.php index.html
    </Directory>

    <Directory /var/www/sites>
        Options FollowSymLinks
        AllowOverride FileInfo Indexes Options=FollowSymLinks,SymLinksIfOwnerMatch,Indexes
        Require expr "-f '/var/www/runtime/lan-enabled'"
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
